name: Curadoria - integridade do atlas

on:
  push:
    paths:
      - 'README.md'
      - 'catalog/**'
      - 'docs/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'catalog/**'
      - 'docs/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CSV and internal Markdown references
        run: python scripts/validate_catalog.py
